name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the game page
        run: python tools/build_pages.py
      - name: Install build tools
        working-directory: launcher
        run: npm ci
      - name: Create the release (if it doesn't exist yet)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./launcher/package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "Fjordborn $V" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
      - name: Build the installer and publish the release
        working-directory: launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
